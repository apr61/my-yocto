# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-my-sw-app"
BBFILE_PATTERN_meta-my-sw-app = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-my-sw-app = "6"

LAYERDEPENDS_meta-my-sw-app = "core"
LAYERSERIES_COMPAT_meta-my-sw-app = "dunfell"
